name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# Workflow para publicar Dólar VE en Azure Static Web Apps (incluye la función
# /api/usdt). Necesita el secret AZURE_STATIC_WEB_APPS_API_TOKEN (deployment
# token que copias del recurso SWA en Azure → Configuration → Manage deployment token).
# Alternativa más simple: al crear el SWA en Azure vinculado a GitHub, Azure
# genera este workflow automáticamente con el token ya cableado; en ese caso
# podés borrar este archivo para evitar tener dos.

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "dist"